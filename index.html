<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>ATR 그리드 분할매매 트래커</title>
<meta name="description" content="ATR 기반 그리드 분할매매 트래커 - 코스피200 / QQQ" />
<meta name="theme-color" content="#ffffff" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="ATR그리드" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="app-header">
  <h1>ATR 그리드 분할매매</h1>
  <nav class="asset-tabs" role="tablist" aria-label="자산 선택">
    <button class="asset-tab" data-asset="kospi" role="tab" aria-selected="true">코스피200</button>
    <button class="asset-tab" data-asset="qqq" role="tab" aria-selected="false">QQQ</button>
  </nav>
</header>

<main id="main-content">

  <!-- 최초 설정 화면 -->
  <section id="setup-panel" class="panel" hidden>
    <h2 class="panel-title">최초 설정</h2>
    <p class="setup-hint">이 자산의 그리드를 시작하기 위한 초기값을 입력하세요.</p>
    <div class="field-group">
      <label for="setup-total-capital">총 투자금 (원)</label>
      <input type="number" id="setup-total-capital" inputmode="numeric" value="100000000" min="0" step="1" />
    </div>
    <div class="field-group">
      <label for="setup-k">ATR 배수 (k)</label>
      <input type="number" id="setup-k" inputmode="decimal" value="1.0" min="0" step="0.1" />
    </div>
    <div class="field-group">
      <label for="setup-entry-price">최초 진입가</label>
      <input type="number" id="setup-entry-price" inputmode="decimal" min="0" step="0.01" placeholder="예: 380.50" />
    </div>
    <div class="field-group">
      <label for="setup-entry-atr">최초 ATR값</label>
      <input type="number" id="setup-entry-atr" inputmode="decimal" min="0" step="0.01" placeholder="예: 5.20" />
    </div>
    <button id="btn-start-grid" class="btn btn-primary btn-block">그리드 시작 (1회차 매수 등록)</button>
  </section>

  <!-- 메인 트래커 화면 -->
  <section id="tracker-panel" hidden>

    <!-- 통계 카드 -->
    <section class="stats-grid">
      <div class="stat-card">
        <span class="stat-label">총 투자금</span>
        <span class="stat-value" id="stat-total-capital">-</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">누적 투입금액</span>
        <span class="stat-value amber-text" id="stat-invested">-</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">진행 회차</span>
        <span class="stat-value" id="stat-round">-</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">현재 기준가</span>
        <span class="stat-value" id="stat-base-price">-</span>
      </div>
    </section>

    <!-- 보유 현황 -->
    <section class="panel">
      <h2 class="panel-title">보유 현황 (진입 내역)</h2>
      <div class="table-wrap">
        <table class="holdings-table" id="holdings-table">
          <thead>
            <tr>
              <th>회차</th>
              <th>매수일</th>
              <th>매수가</th>
              <th>수량</th>
              <th>투입금액</th>
            </tr>
          </thead>
          <tbody id="holdings-body">
          </tbody>
        </table>
        <p id="holdings-empty" class="history-empty">보유 중인 회차가 없습니다.</p>
      </div>
    </section>

    <!-- 그리드 사다리 시각화 -->
    <section class="panel">
      <h2 class="panel-title">그리드 사다리 (1~12회차)</h2>
      <div id="ladder" class="ladder"></div>
      <div class="ladder-legend">
        <span class="legend-item"><i class="legend-swatch filled"></i>체결 완료</span>
        <span class="legend-item"><i class="legend-swatch next"></i>다음 매수 예정</span>
        <span class="legend-item"><i class="legend-swatch empty"></i>미진입</span>
      </div>
    </section>

    <!-- ATR 입력 / 계산 -->
    <section class="panel">
      <h2 class="panel-title">오늘의 ATR 계산</h2>
      <div class="field-group">
        <label for="today-atr">오늘의 ATR값</label>
        <input type="number" id="today-atr" inputmode="decimal" min="0" step="0.01" placeholder="예: 5.80" />
      </div>
      <button id="btn-calc" class="btn btn-secondary btn-block">계산</button>

      <div id="calc-result" class="calc-result" hidden>
        <div class="calc-row buy-row">
          <div class="calc-row-header">
            <span class="calc-tag tag-buy">다음 매수가</span>
            <span id="calc-buy-round" class="calc-round"></span>
          </div>
          <div class="calc-row-value" id="calc-buy-price">-</div>
          <div class="calc-row-sub" id="calc-buy-amount"></div>
        </div>
        <div class="calc-row sell-row">
          <div class="calc-row-header">
            <span class="calc-tag tag-sell">다음 매도가</span>
            <span id="calc-sell-round" class="calc-round"></span>
          </div>
          <div class="calc-row-value" id="calc-sell-price">-</div>
          <div class="calc-row-sub" id="calc-sell-amount"></div>
        </div>
      </div>
    </section>

    <!-- 체결 등록 -->
    <section class="panel">
      <h2 class="panel-title">체결 등록</h2>

      <div class="execution-block buy-block">
        <div class="field-group">
          <label for="buy-fill-price">매수 체결가</label>
          <input type="number" id="buy-fill-price" inputmode="decimal" min="0" step="0.01" />
        </div>
        <button id="btn-buy-fill" class="btn btn-buy btn-block" disabled>매수 체결 등록</button>
        <p id="buy-fill-note" class="field-note"></p>
      </div>

      <div class="execution-block sell-block">
        <div class="field-group">
          <label for="sell-fill-price">매도 체결가</label>
          <input type="number" id="sell-fill-price" inputmode="decimal" min="0" step="0.01" />
        </div>
        <button id="btn-sell-fill" class="btn btn-sell btn-block" disabled>매도 체결 등록</button>
        <p id="sell-fill-note" class="field-note"></p>
      </div>
    </section>

    <!-- 체결 이력 -->
    <section class="panel">
      <h2 class="panel-title">체결 이력</h2>
      <div class="table-wrap">
        <table class="history-table" id="history-table">
          <thead>
            <tr>
              <th>회차</th>
              <th>구분</th>
              <th>날짜</th>
              <th>ATR</th>
              <th>체결가</th>
              <th>수량</th>
              <th>금액</th>
              <th>손익</th>
            </tr>
          </thead>
          <tbody id="history-body">
          </tbody>
        </table>
        <p id="history-empty" class="history-empty">체결 이력이 없습니다.</p>
      </div>
    </section>

    <!-- 초기화 -->
    <section class="panel danger-panel">
      <button id="btn-reset-asset" class="btn btn-danger btn-block">이 자산 초기화</button>
    </section>

  </section>

</main>

<div id="confirm-modal" class="modal-overlay" hidden>
  <div class="modal-box">
    <p id="confirm-message" class="modal-message"></p>
    <div class="modal-actions">
      <button id="confirm-cancel" class="btn btn-secondary">취소</button>
      <button id="confirm-ok" class="btn btn-danger">삭제</button>
    </div>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<script src="app.js"></script>
</body>
</html>
